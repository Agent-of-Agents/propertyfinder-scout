name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy — доставить код и пересобрать образ; restart — только перезапустить контейнер"
        type: choice
        default: deploy
        options: [deploy, restart]

# Два деплоя одного агента одновременно кончились бы гонкой за каталог.
concurrency:
  group: deploy-propertyfinder-scout
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /opt/agents/propertyfinder-scout
      CONTAINER: agent-propertyfinder-scout
      SSH: ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Ключ доступа к серверу
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Первое развёртывание обычно делает deploy_push, но у фабрики нет доступа
      # к серверу, поэтому .env создаётся здесь из секретов репозитория.
      # Если файл уже есть — не трогаем, rsync его тоже исключает.
      - name: Развернуть агента, если он ещё не развёрнут
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_TOKEN: ${{ secrets.PROPERTYFINDER_SCOUT_BOT_TOKEN }}
          BOT_TOKEN_FALLBACK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          MONGO_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if $SSH "$TARGET" "test -f $REMOTE_DIR/.env"; then
            echo "$REMOTE_DIR/.env уже на месте — оставляю как есть"
            exit 0
          fi

          echo "Первое развёртывание: .env на сервере нет, создаю из секретов"

          if [ -z "$BOT_TOKEN" ]; then
            echo "Секрета PROPERTYFINDER_SCOUT_BOT_TOKEN нет, беру TELEGRAM_BOT_TOKEN"
            BOT_TOKEN="$BOT_TOKEN_FALLBACK"
          fi

          missing=""
          [ -z "$API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$BOT_TOKEN" ] && missing="$missing PROPERTYFINDER_SCOUT_BOT_TOKEN(или TELEGRAM_BOT_TOKEN)"
          if [ -n "$missing" ]; then
            echo "::error::Не хватает секретов:$missing — добавь их в настройках репозитория."
            exit 1
          fi
          [ -z "$MONGO_URI" ] && echo "::warning::MONGODB_URI пуст — история диалогов не переживёт перезапуск."
          [ -z "$ALLOWED_IDS" ] && echo "::warning::ALLOWED_USER_IDS пуст — бот никого не пустит."

          umask 077
          {
            echo "ANTHROPIC_API_KEY=$API_KEY"
            echo "AGENT_MODEL=anthropic:claude-opus-5"
            echo "AGENT_MAX_MODEL_RETRIES=3"
            echo "AGENT_MAX_TOOL_RETRIES=2"
            echo "TELEGRAM_BOT_TOKEN=$BOT_TOKEN"
            echo "ALLOWED_USER_IDS=$ALLOWED_IDS"
            echo "MONGODB_URI=$MONGO_URI"
            echo "MONGODB_DB=agent_propertyfinder_scout"
            echo "AGENT_MEMORY_TTL_SECONDS="
          } > env.local

          $SSH "$TARGET" "mkdir -p $REMOTE_DIR"
          $SSH "$TARGET" "cat > $REMOTE_DIR/.env && chmod 600 $REMOTE_DIR/.env" < env.local
          rm -f env.local
          echo ".env создан на сервере"

      - name: Доставить исходники
        if: inputs.mode != 'restart'
        run: |
          rsync -az --delete -e "$SSH"             --exclude '.git/' --exclude '.github/' --exclude '.venv/'             --exclude '__pycache__/' --exclude '.pytest_cache/'             --exclude 'tests/' --exclude '.env'             ./ "$TARGET:$REMOTE_DIR/"

      - name: Собрать образ и поднять контейнер
        if: inputs.mode != 'restart'
        run: $SSH "$TARGET" "cd $REMOTE_DIR && docker compose up -d --build"

      - name: Перезапустить контейнер
        if: inputs.mode == 'restart'
        run: $SSH "$TARGET" "cd $REMOTE_DIR && docker compose restart"

      - name: Убедиться, что контейнер выжил
        run: |
          sleep 10
          read -r state restarts <<< "$($SSH "$TARGET"             "docker inspect -f '{{.State.Status}} {{.RestartCount}}' $CONTAINER")"
          echo "статус: $state, перезапусков: $restarts"
          if [ "$state" != "running" ] || [ "$restarts" != "0" ]; then
            echo "::error::Контейнер не выжил — деплой считается провалившимся."
            $SSH "$TARGET" "docker logs --tail 50 $CONTAINER 2>&1" || true
            exit 1
          fi
